name: Build Windows

on:
  push:
    tags:
      - 'v*-windows'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_OAUTH_CLIENT_ID: ${{ secrets.VITE_OAUTH_CLIENT_ID }}
          VITE_OAUTH_REDIRECT_URI: ${{ secrets.VITE_OAUTH_REDIRECT_URI }}
          VITE_DEFAULT_LANGUAGE: fr
        with:
          tagName: ${{ github.ref_name }}
          releaseName: YoutubeFocus Desktop — Windows ${{ github.ref_name }}
          releaseBody: |
            ## YoutubeFocus Desktop — Windows

            ### Installation
            1. Download the `.msi` file
            2. Double-click to install
            3. First launch: click "More info" → "Run anyway" (SmartScreen warning)

            ### Requirements
            - Windows 10/11 (64-bit)
            - Google account with YouTube subscriptions
          releaseDraft: true
          prerelease: false
